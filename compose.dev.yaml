
services:
  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - angular_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    command: >
      sh -c "npm ci &&
      npx ng serve --host 0.0.0.0
      --poll 1000
      --proxy-config proxy.conf.json"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"

volumes:
  angular_node_modules:
